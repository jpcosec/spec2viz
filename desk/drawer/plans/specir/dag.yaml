  - IR06
  requires: []
  scope: 'Objetivo:

    Un extractor estático que, a partir de código React (JSX y TSX) y de los contratos de API disponibles,
    produce los elementos de interfaz del grafo de specIR y los vincula a las operaciones de backend,
    con evidencia de origen.


    Alcance:

    Dentro: lectura estática de componentes y sus propiedades, controles, acciones (handlers de eventos),
    estados locales declarados y llamadas HTTP; contratos de API disponibles (por ejemplo OpenAPI) para
    resolver a qué operación corresponde cada llamada; producción de controles, acciones, estados y las
    relaciones triggers e invokes hacia operaciones de API; evidencia de origen por nodo y relación con
    archivo, línea y hash; idempotencia.

    Fuera: observación del DOM o de eventos en ejecución; comportamiento dinámico que no se deduce del
    código, que no se afirma: se marca como inferido o se deja como desconocido; generación o modificación
    de código de interfaz.


    Ruta:

    Módulo de extracción en el paquete specIR; el analizador de JSX y TSX se elige en la tarea activa
    y queda aislado detrás del módulo; los vínculos a backend se resuelven contra las operaciones de API
    que ya están en el grafo (pobladas a mano o por el extractor de backend); fixture: el frontend React
    del blog de ejemplo.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan sobre el fixture y la mitad de interfaz de la cadena de publicar un post
    se obtiene sin poblarla a mano.


    Validación:

    - Sobre el fixture del blog, el extractor produce PublishButton, PublishAction y su relación con la
    operación de API de publicar, con los tipos de la tarea de tipos de dominio.

    - Cada nodo y relación extraído lleva archivo, línea y hash del fragmento fuente.

    - Una llamada HTTP cuya URL no se resuelve estáticamente produce una relación marcada como inferida
    o un hueco declarado, nunca una relación observada.

    - Una llamada a un endpoint que no existe en el grafo queda registrada como brecha, no se descarta
    ni se inventa la operación.

    - Ejecutar el extractor dos veces sobre el mismo código deja el store idéntico.

    - Las relaciones extraídas pasan la validación de sus RelationTypeDoc.'
  output_scope:
  - src/specir/extract/react_tsx.py
  - src/specir/extract/api_contracts.py
  - tests/extract/test_react_tsx.py
  - tests/extract/test_api_contracts.py
  - tests/fixtures/blog_frontend/package.json
- id: IR10
  task_doc: desk/tasks/task-ir10-reglas-semánticas-y-análisis-de-impacto.md
  title: IR10 Reglas semánticas y análisis de impacto
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR06
  - IR08
  - IR09
  requires: []
  scope: 'Objetivo:

    Un conjunto de reglas RuleDoc que detectan brechas entre capas y una operación de análisis de impacto,
    expuesta por MCP, que devuelve los elementos afectados por un cambio con el camino que lo justifica.


    Alcance:

    Dentro: reglas RuleDoc, distribuidas por specIR como documentos, para cadenas rotas interfaz, API,
    operación, datos: acción sin operación de API, campo de interfaz ausente del serializer, operación
    sin handler, entidad sin persistencia, política sin representación en la interfaz; cada hallazgo con
    severidad, regla que lo produce y evidencia; operación de impacto: dado un nodo (campo, endpoint,
    regla, tabla), los nodos afectados en las demás capas con el camino de relaciones que lo explica y
    la procedencia de cada tramo; tool MCP de solo lectura para ambas.

    Fuera: proponer parches o cambios de código; aplicar correcciones al grafo; reglas que requieran ejecutar
    la aplicación.


    Ruta:

    Las reglas se escriben en el lenguaje de reglas de SLDB y se evalúan con sus operaciones públicas
    de reglas; el impacto se calcula con las operaciones públicas de recorrido del grafo de SLDB. Si el
    lenguaje de reglas no alcanza para alguna brecha, la carencia se resuelve en SLDB, no con lógica paralela
    en specIR.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan y un agente puede responder por MCP qué partes de la interfaz afecta
    un cambio en un campo, un endpoint o una regla del blog.


    Validación:

    - Por cada regla hay un store de prueba con la brecha sembrada y la evaluación la reporta con su severidad,
    la regla y los documentos implicados.

    - Sobre el grafo completo del blog sin brechas sembradas, las reglas no reportan hallazgos.

    - Dado el campo status de la tabla de posts, la operación de impacto devuelve PublishButton entre
    los afectados, con el camino completo de relaciones.

    - Cada tramo del camino devuelto lleva su procedencia, y un camino que pasa por una relación inferida
    se señala como tal.

    - Las tools de reglas e impacto no escriben en el store (comparación del árbol antes y después).

    - Ninguna respuesta incluye un parche ni una modificación propuesta.'
