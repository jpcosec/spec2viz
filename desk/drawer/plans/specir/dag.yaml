    fuentes que describan explícitamente la conducta requerida. Las pills asociadas al TaskDoc son guardrails
    obligatorios para el trabajo, no fuentes de evidencia técnica. Para la celda Necesidad, formular la
    entrada como “solicitud MCP para <nombre canónico>” y el resultado como el resultado explícito en
    la misma frase de capacidad; no añadir requisitos de producto. En la pregunta al desk usar: “¿Puede
    SLDB exponer o documentar <conducta faltante> mediante la API pública para soportar <nombre canónico>?”
    Para fila 11, “escritura confirmada” significa una operación nivel 1 o 2 cuya evaluación terminó con
    éxito; buscar el equivalente público de la forma `(undo)` de pron §4. Excluir edición de modelos nivel
    3, que la misma sección declara no reversible. No inferir qué escritura elige undo ni su historial.
    En fallback Git, los tres valores desconocidos son commit=desconocido, branch=desconocida y status=no
