    ../spec2viz/.sldb; si el store o el documento faltan, la prueba falla nombrando cuál falta.

    - Montar la copia y ejecutar todas las tools de lectura no modifica ningún archivo de la copia ni
    de los stores federados de deskops y de spec2viz (comparación del árbol antes y después).

    - El store original del repo no cambia durante las pruebas (comparación del árbol de .sldb/ y desk/
    antes y después).

    - Una consulta sobre algo que el store no declara devuelve conjunto vacío con explicación, no un error
    opaco.

    - Una prueba de imports comprueba que el paquete no importa pron, spec2viz, ni módulos de SLDB fuera
