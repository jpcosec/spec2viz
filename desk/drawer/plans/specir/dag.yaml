- id: IR03
  task_doc: desk/tasks/task-ir03-servidor-mcp-de-solo-lectura-sobre-un-store-sldb-real.md
  title: IR03 Servidor MCP de solo lectura sobre un store SLDB real
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR01
  requires: []
  scope: 'Objetivo:

    Un servidor MCP de solo lectura, en el paquete specIR, con el que un agente descubre modelos, lee
    documentos, recorre relaciones y resuelve vistas de un store SLDB.


    Alcance:

    Dentro: servidor MCP por stdio sobre la API pública de SLDB con tools para listar y describir modelos
    y tipos de relación, leer un documento o campo, consultar vecinos salientes/entrantes filtrados por
    tipo de relación y obtener la vecindad a profundidad por dirección, buscar por predicados, resolver
    una vista (ViewDoc o SpecDoc) a JSON e inspeccionar integridad del store. Las tools de grafo son adaptadores
    MCP delgados. La vecindad multi-salto recorre los tipos de relación del índice según la dirección;
    el contrato no promete filtrar un tipo específico en cada salto. specIR no mantiene índice de aristas,
    algoritmo de recorrido, parser de predicados ni backend de grafo propio. Fuera: paths entre dos extremos
    (graph_path/graph_paths), cualquier escritura, tipos de dominio nuevos, extractores y renderizado
    de diagramas.


    Ruta:

    _Outline the expected implementation route or affected surface._


    _Outline the expected implementation route or affected surface._


    _Outline the expected implementation route or affected surface._


    Paquete Python specIR con dependencia en structuredLanguageDB y el SDK de MCP como extra opcional;
    las tools son envoltorios de las operaciones que la matriz de auditoría marca como existentes. Store
    de las pruebas: una copia aislada del store real de este repo, sin registros fabricados. La obtiene
    un fixture de tests/conftest.py que copia a un directorio temporal de la prueba las carpetas .sldb/,
    sldb/ y desk/ de la raíz del repo (los documentos reales del desk: atoms, tareas, rituales, reglas
    y tipos de relación), sin copiar .sldb_cache/. Sobre la copia solo operan herramientas públicas de
    SLDB: sldb stores update para reconstruir los índices derivados, sldb edges rebuild para el índice
    de aristas y sldb stores check para comprobar la integridad antes de usarla; el store federado deskops,
    que el original enlaza por ruta relativa, se vuelve a enlazar en la copia con sldb stores add apuntando
    a su ruta real, y con el mismo comando se enlaza además el store real de spec2viz (../spec2viz/.sldb
    respecto de la raíz de este repo); ambos se leen en sitio en solo lectura y las pruebas no escriben
    en ellos. El servidor bajo prueba es el servidor MCP real, lanzado por stdio y consultado con el cliente
    del SDK de MCP: no se simulan ni la API de SLDB, ni el servidor, ni el cliente. La prueba de resolución
    de vistas usa el SpecDoc real class.sldb-models del store federado de spec2viz: primero comprueba
    que ese documento resuelve desde la federación de la copia y después lo lee y resuelve su vista por
    las tools del servidor. Si el store de spec2viz o ese documento dejan de existir, la prueba falla
    con un mensaje que nombra el store y el documento que faltan; no se sustituye por un documento inventado.
    Mapeo exacto: vecinos salientes/entrantes con filtro de tipo usan `sldb.api.edges_from`/`edges_to`;
    vecindad multi-salto con dirección y profundidad usa `sldb.api.graph.collect_neighborhood_by_direction`,
    que recorre las relaciones del índice y no filtra un tipo en cada salto. Esta tarea no expone paths
    entre dos extremos; si se requieren más adelante, son otra tool delgada que delega en `graph_path`
    (una ruta, con `directed`) o `graph_paths` (varias rutas, con `relations` y `cutoff`). specIR no implementa
    ni itera un recorrido propio como fallback.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan sobre la copia aislada del store real de este repo y un agente conectado
    al servidor recorre ese store sin escribir en él.


