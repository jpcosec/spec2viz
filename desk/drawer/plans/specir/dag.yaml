- id: IR13c
  task_doc: desk/tasks/task-ir13c-notaciones-y-paletas-expuestas-desde-specir.md
  title: IR13c Notaciones y paletas expuestas desde specIR
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR07
  requires: []
  scope: 'Objetivo:

    specIR expone las operaciones de notaciones y paletas de spec2viz delegando en la API pública de SLDB,
    sin redefinir sus modelos.


    Alcance:

    Dentro: listar, validar, sincronizar al store y resolver la vista de notaciones (NotationDoc, GlyphDoc,
    LinkDoc); listar, validar y sincronizar paletas (PaletteDoc), incluida la comprobación de contraste;
    todo como envoltorio de las operaciones de SLDB.

    Fuera: redefinir modelos de vocabulario visual o reimplementar el resolvedor de vistas; catálogos;
    CLI general; migración de consumidores.


    Ruta:

    Módulo src/specir/visual/notations.py que llama a las operaciones de notaciones y vistas de la API
    pública de SLDB. Paridad medida portando a tests/visual/ las pruebas de spec2viz de notación, vista
    de notación y paleta.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan y las filas de notaciones y paletas de la matriz de cobertura tienen
    su condición de retiro cumplida.


    Validación:

    - Listar notaciones y paletas desde specIR devuelve las builtin que distribuye SLDB.

    - Validar una notación o una paleta inválida de los fixtures reporta los mismos problemas que spec2viz,
    incluido el contraste insuficiente.

    - Sincronizar una notación desde specIR deja en un store de prueba sus NotationDoc, GlyphDoc y LinkDoc.

    - La vista resuelta de un spec de fixture desde specIR es igual a la que devuelve la API pública de
    SLDB para ese spec.

    - specIR no define ninguna clase con el nombre de un modelo de vocabulario visual de SLDB, y el módulo
    no importa spec2viz.'
  output_scope:
  - src/specir/visual/notations.py
  - tests/visual/test_notations.py
  - tests/visual/test_palettes.py
- id: IR13d
  task_doc: desk/tasks/task-ir13d-cli-api-python-y-habilidad-de-agente-de-la-capa-visual.md
  title: IR13d CLI, API Python y habilidad de agente de la capa visual
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR13a
  - IR13b
  - IR13c
  - IR12
  requires: []
  scope: 'Objetivo:

    specIR ofrece un comando, una API Python pública y una habilidad de agente que cubren cada entrada
    pública de spec2viz.


    Alcance:

    Dentro: comando de specIR con equivalentes de todos los comandos y subgrupos de spec2viz (diagram,
    notation, palette, catalog, y los alias de primer nivel render, validate, lint, schema y build, y
    about); API Python pública equivalente a la que exporta el paquete spec2viz; habilidad de agente que
    reemplaza a la de uso de spec2viz; tabla de correspondencia comando por comando.

    Fuera: implementar las capacidades, que vienen de las tareas de compiladores, renderers, IR13a, IR13b
    e IR13c; instalar la habilidad en otros repos; migrar consumidores.


    Ruta:

    Módulo src/specir/cli.py y exportaciones públicas en src/specir/visual/__init__.py que conectan las
    capacidades ya implementadas; habilidad en skills/use-specir/SKILL.md; correspondencia en docs/spec2viz/correspondencia-cli.md.
    Paridad medida portando a tests/visual/ las pruebas de spec2viz de CLI, API y empaquetado. Propiedad
    de archivos compartidos: src/specir/visual/__init__.py ya existe cuando esta tarea empieza: lo crea
    la tarea de compiladores y proyecciones (IR11), de la que esta depende por la cadena IR13a e IR12.
    Aquí solo se extiende con las exportaciones públicas que faltan; no se recrea ni se quitan las exportaciones
    existentes.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan y las filas de CLI, API Python y habilidad de la matriz de cobertura
    tienen su condición de retiro cumplida.


    Validación:

    - Cada comando y subgrupo que lista la ayuda de spec2viz tiene una fila en la tabla de correspondencia
    con su equivalente en specIR, y una prueba invoca cada equivalente.

    - Las pruebas de API de spec2viz portadas pasan contra la API pública de specIR.

    - La habilidad de agente nombra solo comandos que existen en el comando de specIR (comprobado por
    una prueba que los extrae y los invoca con ayuda).

    - El paquete se instala en un entorno limpio y el comando arranca sin spec2viz instalado.'
  output_scope:
  - src/specir/cli.py
  - src/specir/visual/__init__.py
  - skills/use-specir/SKILL.md
  - docs/spec2viz/correspondencia-cli.md
  - tests/visual/test_cli.py
  - tests/visual/test_api.py
  - tests/visual/test_packaging.py
