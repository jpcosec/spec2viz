  acceptance: 'Terminado cuando:

    La matriz está escrita, cada fila tiene estado y cita, y los faltantes reales (si los hay) están notificados
    a SLDB.


    Validación:

    - El informe contiene exactamente once capacidades y cada fila incluye capacidad, necesidad con actor/entrada/resultado,
    estado, evidencia, brecha, acción y referencia de handoff.

    - Cada fila usa uno de los estados cerrados y la acción correspondiente; disponible usa usar/componer
    y cada no disponible usa solicitar-extensión.

    - Cada fila disponible cita la ruta/símbolo público o el doc SLDB listado que efectivamente documenta
    la conducta; no inventa símbolos para evidencia documental. Cuando usa composición, cita y describe
    cada operación y su relación documentada.

    - La fila 4 informa por separado la evidencia y disponibilidad de select_documents y search; no combinar
    sus resultados en una sola afirmación. La fila conserva un único estado global más restrictivo y explica
    cada suboperación.

    - Cada fila no disponible enumera módulos existentes inspeccionados y explica la conducta que falta;
    no cita rutas o símbolos inventados.

    - El informe lista el snapshot: commit/branch de sldb si existen, fecha UTC y git status; si los archivos
    de fuente están modificados, incluye hashes SHA-256 para fijar la revisión auditada.

    - Si hay filas no disponibles, se envió un único mensaje cuyo título y cuerpo siguen Implementation
    Path, y el ID exacto aparece en Resumen y filas afectadas; si no hay filas no disponibles, Resumen
    declara que no se envió nota y cada handoff disponible contiene el carácter literal —.

    - Si deskops message send falla o no retorna ID, Resumen registra el resultado y la tarea no se cierra
    como notificada.

    - El informe lista fuentes revisadas y no abre módulos internos de SLDB ni importa/ejecuta pron; leer
    la spec pron como documento está permitido.

    - La tabla usa exactamente este orden de columnas: Capacidad, Necesidad, Estado, Evidencia, Brecha,
    Acción, Handoff.

    - Para toda fila disponible, Brecha dice exactamente “Ninguna: la conducta requerida está documentada.”;
    para filas no disponibles describe la conducta requerida ausente o parcialmente documentada.

    - La celda Necesidad usa exactamente `Actor: ...; Entrada: ...; Resultado esperado: ...`; el actor
    se mantiene “agente MCP de specIR operando un store SLDB”.

    - Las filas no disponibles citan las rutas de los módulos existentes bajo sldb/api que se abrieron
    y evaluaron para esa capacidad. Si no existe símbolo relacionado, indicar “sin operación relacionada”
    y citar los archivos del corpus donde se buscaron candidatos por nombre/concepto; no se exige listar
    archivos no abiertos ni probar ausencia global fuera del corpus.

    - El documento usa exactamente la estructura y títulos fijados en Implementation Path.

    - La celda Necesidad usa la entrada y salida acotadas por Scope, sin agregar requisitos.

    - La fila 4 divide Necesidad, Estado, Evidencia, Brecha y Acción con los sublabels `select_documents:`
    y `search:`; Handoff es común, y Estado incluye el estado por suboperación y el estado global más
    severo.

    - Cada fila no disponible usa la plantilla literal de Pregunta al desk establecida en Scope; cambia
    solo capacidad y conducta faltante.

    - Las pills asociadas se cumplen como guardrails, pero no se citan como evidencia técnica.'
