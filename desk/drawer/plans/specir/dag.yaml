- id: IR11
  task_doc: desk/tasks/task-ir11-compiladores-y-proyecciones-de-spec2viz.md
  title: IR11 Compiladores y proyecciones de spec2viz
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
