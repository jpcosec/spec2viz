    Auditar exactamente 11 filas para el cliente MCP de specIR, con agente MCP como actor y nombre de
    fila igual a la frase tras su número: (1) catálogo de modelos y tipos de relación con campos/tipos;
    (2) leer payload/campo por identidad estable Model:name; (3) vecinos y recorrido dirigido de aristas
    con profundidad; (4) seleccionar por predicados con sldb.api.select_documents y buscar texto rankeado
    con sldb.api.search, anotando requisito de texto además de where; (5) ejecutar una ViewDoc existente;
    (6) crear/editar/borrar documentos ordinarios, RelationDoc, RelationTypeDoc y RuleDoc con validación
    de modelo/reglas; (7) crear modelos, editar esquema, validar/promover draft y registrar clase Python
    existente; (8) diagnósticos públicos de integridad del store e índice de aristas; (9) consultar journal
    e historial de documento/procedencia; (10) leer StoreFingerprint.store_hash y usar la huella global
    como precondición atómica de escritura, rechazando mismatch; (11) detectar operación pública SLDB
    que cumpla la capacidad de deshacer escritura confirmada de kb_undo/forma undo. Para fila 11 no inferir
    detalles ausentes en pron §4: si SLDB ofrece función relacionada pero no documenta el comportamiento
    requerido, clasificar requiere-extensión-en-SLDB y preguntar al desk que lo integre/documente; si
    no hay operación relacionada, faltante y solicitarla. En toda fila, si SLDB ofrece operación relacionada
    pero no demuestra la conducta requerida en una fuente permitida, requiere-extensión-en-SLDB; si no
    hay operación relacionada, faltante. Disponibilidad requiere evidencia directa o composición explícita
    en docstring sldb.api o doc SLDB listado. Composición explícita significa que las fuentes nombran
    las operaciones y describen la relación/orden que produce la capacidad; no se infiere solo por similitud
    de firmas o por combinar funciones sin contrato documentado. Cada una de las dos suboperaciones de
    fila 4 recibe su propia evidencia, resultado de disponibilidad y brecha dentro de esa fila; si difieren,
    la fila usa el estado más restrictivo y enumera ambas. Una fila por número; suboperaciones relacionadas
    no crean filas extra. La decisión final de política de escritura queda fuera solo como decisión de
    producto de IR02; las filas 6, 10 y 11 documentarán las APIs existentes frente a las necesidades declaradas.
    Actor de todas las necesidades: agente MCP de specIR operando un store SLDB. Model:name es la identidad
    estable registrada por SLDB; usar sldb://document/Model:name solo si ../sldb/docs/addressability_model.md
    la respalda. Predicados limitados a sldb.api.where. Estados exactos: disponible, requiere-extensión-en-SLDB,
    faltante; acciones: usar/componer para disponible y solicitar-extensión para no disponible. Handoff
    disponible: EM DASH literal —. Tras envío, repetir el mismo sldb:<stem> en filas no disponibles, con
    stem como basename del path JSON sin .md. Si falla el envío, conservar estado y acción de cada fila
    según la evidencia, cambiar solo handoff a ERROR literal, no afirmar que fue notificada y dejar tarea
    abierta. Resumen enviado exacto: Nota enviada; ID: sldb:<stem>. Sin brechas exacto: No se envió nota:
    todas las capacidades están disponibles. Una nota única puede contener de 1 a 11 secciones, solo una
    por fila no disponible. El informe no diseña tools ni decide política final de escritura. Fuera: código,
    cambios en otros repos, lectura de módulos internos SLDB, importar/ejecutar pron. El nombre canónico
    y capacidad de cada fila es la frase completa tras su número en la lista 1–11; usar esa misma frase
    en título de fila y mensaje. El valor de handoff disponible es exactamente el carácter —, sin texto
    adicional. Si falla cualquier comando Git, usar el fallback para el bloque snapshot completo: los
    tres metadatos como desconocido/no disponible y el error completo; hashear todos los archivos del
    corpus. Ordenar las secciones de la nota por número ascendente de capacidad. La evidencia de API consiste
    en docstring de la función pública citada o documentación SLDB listada que describa esa operación;
    puede estar en su módulo exportado, no se requiere docstring del paquete. El destinatario `--to sldb`
    es el desk SLDB; “Pregunta al desk” es el campo textual dentro de cada sección y no cambia ese destinatario.
    Si `deskops message send` falla, registrar en Resultado el código de salida, stderr completo y stdout
    completo (incluido JSON si lo produjo), en ese orden; no escoger uno ni descartar el otro. Para la
    fila 4, la severidad es disponible < requiere-extensión-en-SLDB < faltante; el estado conjunto es
    el más severo de sus dos suboperaciones. Las frases en cursiva heredadas de la plantilla bajo los
    encabezados describen el tipo de contenido esperado y no son requisitos adicionales de esta tarea.
    Para cada nombre de capacidad, tomar literalmente el texto después de su número hasta el siguiente
    punto y coma; excluir número, paréntesis y separador final, y conservar el resto de la frase. Una
    operación es relacionada solo si su nombre o documentación pública declara propósito, entrada o salida
    que coincide con una parte de la necesidad de esa fila; similitud incidental de firma no basta. La
    conducta está demostrada solo cuando el docstring de la operación pública o los docs permitidos describen
    explícitamente el resultado/precondición que la fila requiere; evidencia parcial se clasifica requiere-extensión-en-SLDB.
    La matriz puede describir brechas y compatibilidad, pero no recomienda política, arquitectura ni nivel
    de mutabilidad de escritura; eso lo decide IR02. La referencia a pron §1 y §4 significa únicamente
    las secciones 1 y 4, no el intervalo 1–4. La fila 11 requiere solo identificar una operación pública
    que revierta una escritura ya confirmada, que es el significado mínimo indicado por pron §4; no inferir
    historial, selección de operación, repetición ni otras semánticas de undo. El ID sldb:<stem> se repite
    en el campo handoff de cada fila no disponible; no se añade al cuerpo de la nota. Al formar el nombre
    de capacidad se quita solo el marcador numérico inicial `(N)` y el separador `;` o punto final de
    la lista; cualquier paréntesis dentro de la frase se conserva. Los docs SLDB permitidos son exactamente
