- id: IR13
  task_doc: desk/tasks/task-ir13-sync-generación-catálogos-consumidores-y-retiro-de-spec2viz.md
  title: IR13 Migración de consumidores y gate final de retiro de spec2viz
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR13a
  - IR13b
  - IR13c
  - IR13d
  - IR07
  requires: []
  scope: 'Objetivo:

    Un comprobador del gate de retiro y un acta que demuestran, con evidencia, que toda capacidad de spec2viz
    está cubierta por specIR y que ningún consumidor importa ni invoca spec2viz.


    Alcance:

    Dentro: comprobador del gate de retiro, que lee la matriz de cobertura y verifica que cada fila tiene
    su condición cumplida con una prueba citada, y que recorre en solo lectura el universo auditado buscando
    dependencias de spec2viz. Universo auditado: exactamente los repos consumidores y los stores que lista
    el inventario de consumidores de docs/spec2viz/matriz-de-cobertura.md, más el propio repo de specIR;
    un repo o store que no esté en ese inventario no se audita, y añadir uno exige actualizar primero
    el inventario. Qué cuenta como dependencia: importaciones de spec2viz en código (import spec2viz o
    from spec2viz); dependencias declaradas en configuración ejecutable (pyproject.toml, requirements,
    archivos de CI, Makefile y scripts); puntos de entrada y llamadas al comando spec2viz en código, scripts
    o configuración ejecutable; llamadas a su API Python; y modelos spec2viz.sldb_models registrados en
    un índice de store. Qué no cuenta: menciones en texto, documentación, comentarios, changelogs o documentos
    del desk. Salida: por cada dependencia remanente, el repo o store, la ruta del archivo, la línea y
    la clase de dependencia; con al menos una, el gate falla con código de salida distinto de cero y el
    retiro no se puede declarar; pedidos de migración a los desks de graph_ui, deskops y de cada repo
    con stores afectados; acta de retiro con la evidencia por fila y por consumidor; actualización de
    la matriz de cobertura con esa evidencia.

    Fuera: implementar capacidades de spec2viz, que corresponden a las tareas de compiladores, renderers,
    IR13a, IR13b, IR13c e IR13d; editar archivos de otros repos; archivar o borrar el repo spec2viz, que
    es decisión de su dueño una vez cumplido el gate.


    Ruta:

    Módulo src/specir/visual/retirement.py con el comprobador, expuesto como subcomando del comando de
    specIR; lee del inventario de la matriz de cobertura la lista de repos consumidores y de stores a
    revisar y recibe por argumento solo la ruta local de cada uno; no escribe en ellos. Si el gate falla,
    el acta registra las dependencias remanentes con su ruta y línea y deja el retiro como no declarado.
    Los cambios en otros repos se piden con deskops message send --to <repo> y se registran en docs/spec2viz/acta-de-retiro.md
    con la referencia al cambio que los resolvió. La matriz docs/spec2viz/matriz-de-cobertura.md se actualiza
    con la prueba que acredita cada fila. Propiedad de archivos compartidos: docs/spec2viz/matriz-de-cobertura.md
    ya existe cuando esta tarea empieza: la crea la tarea de cobertura (IR07). Aquí solo se actualiza,
    añadiendo por fila la prueba y la evidencia de cumplimiento, después de cerradas IR13a, IR13b, IR13c
    e IR13d; no se cambian los modos ni las condiciones de retiro que fijó IR07 sin registrarlo en el
    acta. Propiedad de archivo compartido: src/specir/cli.py lo crea la tarea IR13d con la base del comando
    y sus subcomandos; esta tarea agrega ahí solo el subcomando del gate de retiro, después de cerrada
    IR13d, de la que depende, sin modificar los subcomandos existentes.'
  acceptance: 'Terminado cuando:

    El comprobador termina con código de salida cero sobre todo el universo auditado, el acta de retiro
    está completa y declara el retiro, y spec2viz puede archivarse sin que ningún repo del workspace falle.


    Validación:

    - El comprobador falla sobre una matriz de entrada con una fila sin prueba citada y pasa cuando todas
    la tienen.

    - Sobre un repo de entrada con una importación de spec2viz en código, una dependencia en pyproject.toml
    y una llamada al comando spec2viz en un script, y un índice de store con un modelo spec2viz.sldb_models,
    el comprobador reporta las cuatro con repo, ruta, línea y clase de dependencia, termina con código
    de salida distinto de cero y no modifica ningún archivo.

    - Sobre un repo de entrada que solo menciona spec2viz en documentación, comentarios y un changelog,
    el comprobador no reporta ninguna dependencia.

    - El comprobador audita exactamente los repos y stores del inventario de la matriz de cobertura más
    el repo de specIR, y falla con un error que lo dice si se le pide auditar uno que no está en el inventario
    o si falta la ruta de uno que sí está.

    - Ejecutado sobre todos los repos y stores reales del inventario, el comprobador no reporta ninguna
    dependencia y termina con código de salida cero.

    - La suite de spec2viz pasa contra specIR, o cada prueba no portada tiene su equivalente declarado
    en la matriz de cobertura.

    - El acta de retiro lista, por cada consumidor del inventario, el mensaje enviado a su desk, la referencia
    del cambio que lo resolvió y la salida del comprobador; si quedó alguna dependencia, el acta dice
    que el retiro no está declarado.

    - Toda fila de la matriz de cobertura tiene su condición de retiro cumplida y su prueba citada.'
  output_scope:
  - src/specir/visual/retirement.py
  - src/specir/cli.py
  - tests/visual/test_retirement_gate.py
  - docs/spec2viz/acta-de-retiro.md
  - docs/spec2viz/matriz-de-cobertura.md
