- id: IR04
  task_doc: desk/tasks/task-ir04-escritura-validada-por-mcp-proponer-validar-aplicar.md
  title: 'IR04 Escritura validada por MCP: proponer, validar, aplicar'
  kind: code
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR02
  - IR03
  requires: []
  scope: 'Objetivo:

    Tools MCP de escritura con las que un agente propone, valida y aplica cambios al store, con el mecanismo
    decidido en la tarea de contrato de escritura.


    Alcance:

    _State what is in scope and what is out of scope._


    Dentro, mutaciones del store que expone el MCP: crear, editar y borrar documentos de modelos ya registrados;
    afirmar y retirar aristas (RelationDoc); declarar y editar tipos de relación (RelationTypeDoc) y reglas
    (RuleDoc), que son documentos del store y por eso se escriben como datos. Toda escritura admite ejecución
    en seco. Fuera: crear o editar clases Python de modelos por MCP. Las clases de modelo se definen como
    código en el paquete specIR (o en el paquete del proyecto que las declare) y entran al store por el
    registro de modelos de SLDB; exponer su edición por MCP queda como decisión posterior, condicionada
    a la tarea de contrato de escritura. Fuera también: síntesis de código de aplicación. En specIR, estas
    operaciones solo se exponen como tools MCP; no se implementan funciones propias de CRUD ni escrituras
    directas al filesystem o a índices SLDB. La creación, edición, borrado, validación de modelos, reglas
    e integridad se delegan en las operaciones existentes de `sldb.api`; si una capacidad falta, se pide
    extensión al desk SLDB.


    Ruta:

    _Outline the expected implementation route or affected surface._


    Las tools envuelven las operaciones de escritura, prevalidación, reglas y transiciones que la matriz
    de auditoría marca como existentes en la API pública de SLDB; lo que falte se resuelve en SLDB, no
    en specIR. Delegación obligatoria por operación: crear documento con `sldb.api.create_document`; editar
    payload de documento existente con `sldb.api.save_document_payload`; borrar con `sldb.api.delete_document`.
    RelationDoc, RelationTypeDoc y RuleDoc se escriben como documentos mediante esas mismas funciones
    con su modelo registrado, no mediante mutación propia del índice de aristas. Los tools MCP convierten
    argumentos tipados a llamadas API y devuelven sus resultados/errores; no duplican serialización, renderizado,
    validación de modelo/reglas, mantenimiento de índices, ni borrado de archivos. Para agrupar cambios
    usa `sldb.api.transaction` cuando corresponda. La ejecución en seco y el contrato de precondición
    usan mecanismos existentes de SLDB; si la API pública no los ofrece, el nodo no crea una implementación
    paralela en specIR y deja la brecha solicitada a SLDB.'
  acceptance: 'Terminado cuando:

    Las pruebas anteriores pasan contra un store de prueba y un agente completa el ciclo proponer, validar
    y aplicar sobre un documento y sobre una arista.


    Validación:

    - Una ejecución en seco devuelve lo que se escribiría y no cambia ningún archivo del store.

    - Aplicar un cambio validado sobre un store que cambió después de la validación es rechazado con un
    error que lo dice.

    - Una arista que viola los tipos de origen o destino, la cardinalidad o la condición de su RelationTypeDoc
    es rechazada antes de escribir.

    - Un cambio que incumple un RuleDoc vigente es rechazado o reportado según la severidad de la regla,
    y la respuesta nombra la regla.

    - Ninguna tool de escritura recibe texto libre para interpretar: solo argumentos tipados.

    - Cada documento escrito lleva en su procedencia quién y por qué operación se escribió.

    - Una tool por encima del nivel de escritura permitido responde error sin evaluar nada.

    - No existe ninguna tool que cree o modifique módulos Python.'
  output_scope:
  - src/specir/mcp/write_tools.py
  - src/specir/mcp/changes.py
  - src/specir/mcp/mutability.py
  - tests/mcp/test_write_tools.py
  - tests/mcp/test_dry_run.py
  - tests/mcp/test_mutability.py
- id: IR05
  task_doc: desk/tasks/task-ir05-decisión-procedencia-y-divergencia-entre-código-y-modelo.md
  title: 'IR05 Decisión: procedencia y divergencia entre código y modelo'
  kind: decision
  node_role: delivery
  parent_id: ROOT
  owner_repo: specIR
  depends_on:
  - IR01
  requires: []
  scope: 'Objetivo:

    Una taxonomía canónica de procedencia para specIR y una regla para la divergencia entre el modelo
    y el código del que se extrajo.


    Alcance:

    Dentro: elegir la taxonomía canónica entre (1) observado, inferido, validado (fundamentos_modelado_semantico_mcp.md,
    sección 7); (2) observado, derivado estáticamente, inferencia de LLM, verificado (Plan_IR.md, fase
    5); (3) la autoridad de SLDB: source_raw, authored, theorem, generated, cache (sldb/src/sldb/models/provenance.py);
    definir las equivalencias; decidir si la relación entre un nodo extraído y su fuente se expresa con
    las anclas de código de SLDB; decidir qué prevalece cuando modelo y código discrepan y cómo se representa
    lo desconocido. Fuera: implementar extractores.


    Ruta:

    Cada decisión se registra como atom. Lectura de sldb/docs/architecture/provenance.md y anchoring.md.'
  acceptance: 'Terminado cuando:

    Los tres atoms existen y las tareas de tipos de dominio y de extractores pueden citar una sola taxonomía.


    Validación:

    - Existe un atom con la taxonomía canónica y la tabla de equivalencias con las otras dos listas.

    - Existe un atom que dice cómo se representa lo desconocido y cómo una inferencia pasa a validada,
    y por acción de quién.

    - Existe un atom sobre divergencia: qué ocurre con un nodo cuya fuente cambió.

    - Si la decisión exige algo que SLDB no tiene, la carencia está identificada con la fila correspondiente
    de la matriz de auditoría.'
  output_scope:
