  - IR06
  requires: []
  scope: 'Objetivo:

    specIR compila todos los tipos de diagrama que compila spec2viz y produce diagramas tanto desde un
    spec autorado como desde una proyección del grafo, según el contrato decidido en la tarea de cobertura.


    Alcance:

    Dentro: modelos de spec, carga y validación para clase, secuencia, estado, componente, actividad,
    despliegue, matriz y reflexión; representación intermedia visual propia de specIR y un compilador
    por tipo; materialización de proyecciones: de un ViewDoc evaluado por la API de SLDB sobre su grafo
    y de un SpecDoc con sus SpecNodeDoc a la misma representación intermedia. specIR puede transformar
    esos resultados en nodos y aristas específicos del dominio/diagrama, pero la consulta del store, el
    índice, las aristas autoradas y los recorridos genéricos siguen siendo de SLDB y se consumen mediante
    su API pública. Los modelos de vocabulario visual se usan desde SLDB y no se redefinen. Fuera: índice
    o backend genérico de grafo, renderizado a formatos de salida, linter y recursos empaquetados; sincronización
    al store, catálogos y consumidores; retirar spec2viz.


    Ruta:

    _Outline the expected implementation route or affected surface._


    Módulos de compilación en el paquete specIR; resolución de vistas por la API pública de SLDB. Paridad:
    los fixtures y pruebas de compiladores de spec2viz se portan a tests/visual/ de specIR y se comparan
    por equivalencia estructural normalizada de la representación intermedia: mismos tipos de elemento,
    mismos campos con los mismos valores, mismos nodos y aristas con los mismos extremos y atributos,
    comparados tras ordenar de forma determinista las colecciones cuyo orden no es significativo (nodos
    y aristas por id) y conservando el orden donde sí lo es (pasos de actividad, mensajes de secuencia,
    miembros de clase). Solo se excluye de la comparación la metadata de procedencia (origen, marcas de
    tiempo, rutas absolutas); cualquier otra diferencia es un fallo o una diferencia declarada en la matriz.
    El código de specIR bajo src/ no importa spec2viz. Las pruebas de paridad bajo tests/ sí pueden importar
    spec2viz como oráculo de desarrollo para producir el valor esperado, marcadas como pruebas de paridad
    y omitidas si spec2viz no está instalado; cuando spec2viz se retire, el oráculo se sustituye por los
    resultados guardados de su última ejecución. Propiedad de archivos compartidos: esta tarea crea src/specir/visual/__init__.py
    con las exportaciones de modelos de spec, compiladores y proyecciones; la tarea IR13d lo extiende
    después con la API pública completa, y corre siempre después de esta porque depende de ella por la
    cadena IR13a e IR12. `projections.py` obtiene datos del store mediante la API pública de SLDB: `run_view`
    para ViewDoc compuesto, `evaluate_projection_view` para ViewDoc de proyección y `resolve_view` para
    SpecDoc; luego los transforma a la representación visual específica. No consulta archivos/índices
    internos ni reproduce recorridos genéricos.'
  acceptance: 'Terminado cuando:

    Las pruebas de paridad de compiladores pasan en specIR y las filas de compiladores y proyecciones
    de la matriz de cobertura tienen su condición de retiro cumplida.


    Validación:

    - Los ocho tipos de diagrama compilan en specIR, y cada fixture de compilador de spec2viz produce
    en specIR una representación intermedia estructuralmente equivalente a la de spec2viz según la normalización
    definida en el camino de implementación, o la diferencia está declarada en la fila correspondiente
    de la matriz de cobertura con su prueba equivalente.

    - La función de normalización tiene su propia prueba: dos representaciones que difieren solo en el
    orden de nodos o en metadata de procedencia resultan iguales, y dos que difieren en un campo, un nodo
    o una arista resultan distintas.

    - Los specs YAML existentes validan en specIR con los mismos errores tipados que en spec2viz, salvo
    que la decisión de la tarea de cobertura diga otra cosa.

    - Un diagrama de componentes y uno de estados generados desde proyecciones del grafo del blog muestran
    la entidad Post y el store sigue teniendo un solo documento para ella.

    - Compilar desde un spec autorado y desde la proyección equivalente del grafo da representaciones
    intermedias estructuralmente equivalentes según la misma normalización.

    - specIR no define ninguna clase con el nombre de un modelo de vocabulario visual de SLDB.

    - Ningún módulo bajo src/specir/ importa spec2viz (prueba de imports); spec2viz solo aparece importado
    en pruebas de paridad bajo tests/.'
  output_scope:
  - src/specir/visual/__init__.py
  - src/specir/visual/spec_models.py
  - src/specir/visual/loader.py
  - src/specir/visual/validator.py
  - src/specir/visual/ir.py
  - src/specir/visual/compilers.py
  - src/specir/visual/projections.py
  - tests/visual/test_spec_models.py
  - tests/visual/test_compilers.py
  - tests/visual/test_projections.py
