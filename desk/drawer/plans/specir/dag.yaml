    y aristas; nivel 2 reglas del mundo (tipos, condiciones y transiciones); excluye nivel 3 modelos/esquema.
    Para disponibilidad, se acepta como evidencia suficiente una ruta pública citada o un doc SLDB listado
    que describa explícitamente el contrato; la fila cita el tipo de fuente que realmente lo demuestra
    y nunca inventa símbolos. Si la fuente es un doc, la celda Evidencia no tiene que incluir ruta bajo
