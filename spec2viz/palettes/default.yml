# Paleta builtin de spec2viz: colores, forma e icono por defecto para los kinds comunes de
# infraestructura y arquitectura. Es un documento del store (`PaletteDoc:default`, escrito por
# `spec2viz palette sync` o por `notation sync` de una notacion que la usa), no codigo.
#
# Accesibilidad (`spec2viz palette validate` lo comprueba):
# - cada trazo contrasta >= 3:1 con el fondo de su tema (WCAG 2.2 SC 1.4.11, objetos graficos);
# - el texto (`ink`) sobre cada relleno contrasta >= 4.5:1 (WCAG AA, texto normal);
# - el color nunca es la unica senal: cada kind tiene un par (forma, icono) propio, asi que dos
#   kinds se distinguen aunque se confundan sus tonos (deuteranopia, protanopia, tritanopia).
#   Los tonos parten de la paleta Okabe-Ito, pensada para daltonismo.
#
# Los colores se nombran como tokens (`database-fill`) con un valor por tema; una notacion o un
# spec pueden usar un token o un hex `#rrggbb` (que vale para los dos temas).
name: default
title: spec2viz default palette
backgrounds: {light: "#ffffff", dark: "#0d1117"}
ink: {light: "#1f2328", dark: "#e6edf3"}

# set de iconos declarado: nombres de Lucide (https://lucide.dev, licencia ISC) tal como los
# exporta lucide-react 0.577.0, en kebab-case. Solo estos nombres son validos; nunca una URL.
icon_set:
  name: lucide
  version: "0.577.0"
  icons:
    - app-window
    - archive
    - box
    - cloud
    - container
    - cpu
    - database
    - file-text
    - git-branch
    - globe
    - hard-drive
    - inbox
    - key-round
    - laptop
    - layers
    - list-ordered
    - lock
    - mail
    - message-square
    - monitor
    - network
    - package
    - router
    - server
    - shield-check
    - sticky-note
    - user
    - workflow

colors:
  database-fill: {light: "#dbebf4", dark: "#092c42"}
  database-stroke: {light: "#0072b2", dark: "#0072b2"}
  queue-fill: {light: "#fcf2db", dark: "#4a3911"}
  queue-stroke: {light: "#b37c00", dark: "#e69f00"}
  storage-fill: {light: "#dbf1eb", dark: "#093831"}
  storage-stroke: {light: "#00996f", dark: "#009e73"}
  gateway-fill: {light: "#f8ecf3", dark: "#422e3f"}
  gateway-stroke: {light: "#c5679b", dark: "#cc79a7"}
  auth-fill: {light: "#f9e8db", dark: "#452711"}
  auth-stroke: {light: "#d55e00", dark: "#d55e00"}
  backend-fill: {light: "#e7f4fc", dark: "#213f52"}
  backend-stroke: {light: "#1b8dce", dark: "#56b4e9"}
  frontend-fill: {light: "#fdfbe5", dark: "#4d4c23"}
  frontend-stroke: {light: "#92890c", dark: "#f0e442"}
  client-fill: {light: "#efefef", dark: "#313338"}
  client-stroke: {light: "#848484", dark: "#8c8c8c"}
  external-fill: {light: "#e8e8e8", dark: "#23252a"}
  external-stroke: {light: "#5a5a5a", dark: "#6e6e6e"}

kinds:
  database: {shape: cylinder, icon: database, fill: database-fill, stroke: database-stroke}
  queue: {shape: queue, icon: list-ordered, fill: queue-fill, stroke: queue-stroke}
  storage: {shape: cylinder, icon: archive, fill: storage-fill, stroke: storage-stroke}
  gateway: {shape: rounded-box, icon: router, fill: gateway-fill, stroke: gateway-stroke}
  auth: {shape: rounded-box, icon: shield-check, fill: auth-fill, stroke: auth-stroke}
  backend: {shape: box, icon: server, fill: backend-fill, stroke: backend-stroke}
  frontend: {shape: box, icon: app-window, fill: frontend-fill, stroke: frontend-stroke}
  client: {shape: rounded-box, icon: laptop, fill: client-fill, stroke: client-stroke}
  external: {shape: cloud, icon: globe, fill: external-fill, stroke: external-stroke}
