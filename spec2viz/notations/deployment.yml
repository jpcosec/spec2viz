# Notacion builtin de spec2viz: despliegue sobre un spec `type: deployment`.
# Nodos y artefactos son SpecNodeDoc; `collection` los distingue. Un nodo contiene artefactos y otros
# nodos (`contains`, anidamiento a cualquier profundidad). Una conexion es `connects` (communication
# path) con su rotulo y protocolo en `data`; «deploy» y «manifest» son relaciones propias, punteadas.
name: deployment
title: Deployment
diagram_type: deployment
level: instances
projection: all
layout: {kind: graph, direction: LR}

glyphs:
  - id: artifact
    title: Artifact
    model: SpecNodeDoc
    where: collection = "artifacts"
    shape: artifact
    label: "{title}"
    keyword: "«{kind}»"
    function: artifact
  - id: node
    title: Node
    model: SpecNodeDoc
    shape: node-box
    label: "{title}"
    keyword: "«{kind}»"
    function: node

links:
  - id: contains
    title: Deployed in
    relation: contains
    draw: nest
  - id: deploy
    title: Deploy
    relation: deploy
    draw: line
    line: dashed
    source_end: none
    target_end: open-arrow
    label: "«deploy» {data.label}"
  - id: manifest
    title: Manifest
    relation: manifest
    draw: line
    line: dashed
    source_end: none
    target_end: open-arrow
    label: "«manifest» {data.label}"
  - id: connection
    title: Connection
    relation: "*"
    draw: line
    line: solid
    source_end: none
    target_end: none
    label: "{data.label} {data.protocol}"
