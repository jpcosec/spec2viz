title: "Pattern: preserve spec2viz contracts while fixing CLI behavior"
summary: "Maintain schema and contract boundaries while repairing CLI issues."
what: "This pill gives a fresh subagent the minimum context needed to execute a spec2viz task without drifting from CLI repair into renderer redesign."
why: "Spec2viz is a formal reflection bridge, not just a renderer. Fixing user-facing command crashes can accidentally drift the schema names, aliases, fixture expectations, or generated artifacts away from the contract."
when: "Apply to tasks that touch schema, validate, render, renderer discovery, batch rendering, compatibility shims, or golden files."
where: "Primary owner files:\n- tools/spec2viz/spec2viz/cli.py\n- tools/spec2viz/spec2viz/schema.py\n- tools/spec2viz/spec2viz/loader.py\n- tools/spec2viz/spec2viz/renderers/\n- tools/spec2viz/examples/\n- tools/spec2viz/tests/"
how: "Validate through CLI commands and compare generated artifacts when fixtures or golden files are involved. Keep aliases user-friendly without hiding canonical diagram types."
how_not: "Do not fix a crash by weakening schema validation or silently changing canonical fixture output without updating the expected artifact intentionally. Do not add compatibility shims beyond the named legacy surface."
tags:
  - system:spec2viz
  - topic:cli
  - topic:contract
