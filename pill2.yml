title: "Test Fixture: spec2viz fixtures and golden outputs"
summary: "Maintain clear contracts between canonical input specs, rendered artifacts, and expected diffs."
what: "Spec2viz fixture and golden-output tasks must preserve a clear contract between canonical input specs, rendered artifacts, and expected diffs."
why: "Spec2viz proves reflection through artifacts. Golden files are not incidental snapshots; they are executable expectations. Updating them without a contract hides regressions."
when: "Apply to tasks touching examples, fixtures, PlantUML/Mermaid/D2 output, enforcement artifacts, batch rendering, or golden file synchronization."
where: "Primary owner surfaces:\n- tools/spec2viz/examples/\n- tools/spec2viz/tests/\n- renderer output fixtures and golden files\n- tools/spec2viz/spec2viz/renderers/\n- tools/spec2viz/spec2viz/loader.py"
how: "Regenerate the affected artifact, diff it against the golden file, and explain whether each diff is intentional. For batch tasks, verify every expected artifact is regenerated and no unrelated golden file changes."
how_not: "Do not bulk overwrite goldens to get tests green. Do not mix fixture schema changes with renderer changes unless the task explicitly couples them."
tags:
  - system:spec2viz
  - topic:fixtures
  - topic:golden-files
