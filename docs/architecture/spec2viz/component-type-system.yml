      label: default
    - from: deployment_ir
      to: plantuml
      relation: uses
      label: default
    - from: matrix_ir
      to: vega
      relation: uses
      label: default
    - from: enforcement
      to: json_r
      relation: uses
      label: default

    # Alternative renderers
    - from: sequence_ir
      to: mermaid
      relation: uses
      label: alt
    - from: state_ir
      to: mermaid
      relation: uses
      label: alt
