    - from: sequence_ir
      to: d2
      relation: uses
      label: alt
    - from: state_ir
      to: d2
      relation: uses
      label: alt
    - from: component_ir
      to: d2
      relation: uses
      label: alt
    - from: activity_ir
      to: d2
      relation: uses
      label: alt
    - from: deployment_ir
      to: d2
      relation: uses
      label: alt
    - from: matrix_ir
      to: antonia
      relation: uses
      label: alt
