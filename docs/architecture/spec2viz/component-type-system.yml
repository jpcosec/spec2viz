    - from: sequence_d
      to: sequence_ir
      relation: uses
      label: SequenceCompiler
    - from: state_d
      to: state_ir
      relation: uses
      label: StateCompiler
    - from: component_d
      to: component_ir
      relation: uses
      label: ComponentCompiler
    - from: activity_d
      to: activity_ir
      relation: uses
      label: ActivityCompiler
    - from: deployment_d
      to: deployment_ir
      relation: uses
      label: DeploymentCompiler
    - from: matrix_d
      to: matrix_ir
      relation: uses
      label: MatrixCompiler
    - from: reflection_d
      to: enforcement
      relation: uses
      label: ReflectionCompiler

    # Default renderers
    - from: sequence_ir
      to: plantuml
      relation: uses
      label: default
    - from: state_ir
      to: plantuml
      relation: uses
      label: default
    - from: component_ir
      to: plantuml
      relation: uses
      label: default
    - from: activity_ir
