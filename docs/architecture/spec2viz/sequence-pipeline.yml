id: spec2viz.sequence-pipeline
title: Pipeline de Compilación y Renderizado
type: sequence
version: "0.1"
metadata:
  author: antIA / Antigravity
  description: Secuencia de llamadas desde el comando CLI hasta la emisión del diagrama renderizado
data:
  participants:
    - id: User
      kind: actor
    - id: CLI
      kind: component
    - id: Loader
      kind: component
    - id: Compiler
      kind: component
    - id: IR
      kind: database
    - id: Renderer
      kind: component
  messages:
    - from: User
      to: CLI
      message: "spec2viz render spec.yml --backend mermaid"
    - from: CLI
      to: Loader
      message: "load(spec.yml)"
    - from: Loader
      to: Compiler
      message: "compile(DiagramModel)"
    - from: Compiler
      to: IR
      message: "Instancia DiagramIR desacoplado"
    - from: CLI
      to: Renderer
      message: "render(DiagramIR)"
    - from: Renderer
      to: User
      message: "Retorna código renderizado (Mermaid/PlantUML)"
