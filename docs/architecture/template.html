<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spec2viz Architecture & Knowledge Base</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-sidebar: #0f172a;
      --border-color: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-yellow: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    aside {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .brand {
      padding: 20px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav {
      flex: 1;
      padding: 20px 10px;
      overflow-y: auto;
    }

    .nav-category span {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding: 10px;
      display: block;
    }

    .nav-category a {
      display: block;
      padding: 8px 12px;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.2s;
      margin-bottom: 4px;
    }

    .nav-category a:hover {
      background-color: var(--bg-card);
      color: var(--primary);
    }

    /* Main Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      position: relative;
    }

    .macro-separator {
      margin: 40px 0 20px 0;
    }

    .macro-separator h2 {
      font-size: 1.1rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 40px;
    }

    section h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    section .desc {
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .board {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      position: relative;
    }

    /* Highlighting / Marking Styles */
    .mermaid .node {
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .mermaid .node:hover,
    .mermaid .node.marked {
      filter: drop-shadow(0 0 8px var(--primary));
      stroke: var(--primary) !important;
      stroke-width: 3px !important;
    }

    .mermaid .node rect,
    .mermaid .node circle,
    .mermaid .node polygon {
      transition: all 0.25s ease;
    }

    .mermaid .node.marked rect,
    .mermaid .node.marked polygon {
      fill: #0369a1 !important;
      stroke: var(--primary) !important;
    }

    /* Hover Tooltip / Popover (5W1H1 Preview) */
    #hover-popover {
      position: fixed;
      display: none;
      z-index: 1000;
      background: #1e293b;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      width: 320px;
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    #hover-popover .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    #hover-popover .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 6px;
      border-radius: 4px;
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .badge.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
    }

    #hover-popover .snippet {
      font-size: 0.82rem;
      color: var(--text-main);
      line-height: 1.4;
      max-height: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Atom Drawer / Modal Panel */
    #atom-panel {
      width: 440px;
      background-color: var(--bg-card);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    #atom-panel.active {
      transform: translateX(0);
    }

    .atom-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .atom-header h3 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .atom-tabs {
      display: flex;
      flex-wrap: wrap;
      background: var(--bg-dark);
      padding: 8px;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .atom-tab {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .atom-tab.active {
      background-color: var(--primary);
      color: var(--bg-dark);
      border-color: var(--primary);
    }

    .atom-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .atom-content h4 {
      color: var(--accent-green);
      margin-bottom: 10px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <span>📐 spec2viz Architecture</span>
    </div>
    <nav>
      {{NAV}}
    </nav>
  </aside>

  <main>
    {{SECTIONS}}
  </main>

  <!-- Hover Popover (5W1H1 Preview) -->
  <div id="hover-popover">
    <div class="title" id="popover-title">Node Title</div>
    <div class="badges" id="popover-badges"></div>
    <div class="snippet" id="popover-snippet">Pasa el mouse o haz clic para ver la KB.</div>
  </div>

  <!-- Side Panel Drawer for Atom Details -->
  <div id="atom-panel">
    <div class="atom-header">
      <h3 id="atom-node-title">Atom Detail</h3>
      <button class="close-btn" onclick="closeAtomPanel()">&times;</button>
    </div>
    <div class="atom-tabs" id="atom-tabs"></div>
    <div class="atom-content" id="atom-content">
      <p style="color: var(--text-muted)">Haz clic en un nodo de diagrama para explorar su Knowledge Base de 5WH1+.</p>
    </div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });

    const popover = document.getElementById('hover-popover');
    const popoverTitle = document.getElementById('popover-title');
    const popoverBadges = document.getElementById('popover-badges');
    const popoverSnippet = document.getElementById('popover-snippet');

    function closeAtomPanel() {
      document.getElementById('atom-panel').classList.remove('active');
      document.querySelectorAll('.mermaid .node.marked').forEach(n => n.classList.remove('marked'));
    }

    function norm(str) {
      return str ? str.trim().toLowerCase().replace(/\s+/g, ' ') : '';
    }

    function findAtomData(nodeText) {
      if (!window.ATOMS_DB) return null;
      const cleanText = norm(nodeText);
      
      // Direct match
      if (window.ATOMS_DB[cleanText]) return window.ATOMS_DB[cleanText];

      // Partial match
      for (const k in window.ATOMS_DB) {
        if (cleanText.includes(k) || k.includes(cleanText)) {
          return window.ATOMS_DB[k];
        }
      }
      return null;
    }

    function markNode(nodeEl) {
      document.querySelectorAll('.mermaid .node.marked').forEach(n => n.classList.remove('marked'));
      if (nodeEl) nodeEl.classList.add('marked');
    }

    function showHoverPopover(e, nodeText) {
      const data = findAtomData(nodeText);
      popoverTitle.innerText = nodeText;
      popoverBadges.innerHTML = '';

      if (!data || !data.atoms) {
        popoverSnippet.innerText = 'Sin átomos 5WH1+ registrados.';
      } else {
        const questions = ['what', 'why', 'how', 'how_not', 'when', 'where', 'for_whom'];
        let firstSnippet = '';

        questions.forEach(q => {
          if (data.atoms[q]) {
            const span = document.createElement('span');
            span.className = 'badge active';
            span.innerText = q.replace('_', ' ');
            popoverBadges.appendChild(span);
            if (!firstSnippet) firstSnippet = `[${q.toUpperCase()}] ${data.atoms[q].body.substring(0, 100)}...`;
          }
        });
        popoverSnippet.innerText = firstSnippet || 'Haz clic para explorar los átomos.';
      }

      const left = Math.min(e.clientX + 15, window.innerWidth - 340);
      const top = Math.min(e.clientY + 15, window.innerHeight - 150);
      popover.style.left = left + 'px';
      popover.style.top = top + 'px';
      popover.style.display = 'block';
    }

    function hideHoverPopover() {
      popover.style.display = 'none';
    }

    function selectNodeAtoms(nodeTitle, nodeEl) {
      markNode(nodeEl);
      hideHoverPopover();

      const panel = document.getElementById('atom-panel');
      const titleEl = document.getElementById('atom-node-title');
      const tabsEl = document.getElementById('atom-tabs');
      const contentEl = document.getElementById('atom-content');

      const data = findAtomData(nodeTitle);

      if (!data || !data.atoms) {
        titleEl.innerText = nodeTitle;
        tabsEl.innerHTML = '';
        contentEl.innerHTML = '<p style="color: var(--text-muted)">No hay átomos 5WH1+ registrados para este componente.</p>';
        panel.classList.add('active');
        return;
      }

      titleEl.innerText = data.title;
      tabsEl.innerHTML = '';

      const questions = ['what', 'why', 'how', 'how_not', 'when', 'where', 'for_whom'];
      let firstActive = null;

      questions.forEach(q => {
        if (data.atoms[q]) {
          const btn = document.createElement('button');
          btn.className = 'atom-tab';
          btn.innerText = q.replace('_', ' ');
          btn.onclick = () => {
            document.querySelectorAll('.atom-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            contentEl.innerHTML = `<h4>5WH1+: ${q.toUpperCase()} (${data.atoms[q].id})</h4><p>${data.atoms[q].body}</p>`;
          };
          tabsEl.appendChild(btn);
          if (!firstActive) firstActive = btn;
        }
      });

      if (firstActive) firstActive.click();
      panel.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.querySelectorAll('.mermaid .node').forEach(node => {
          node.addEventListener('mouseenter', (e) => {
            const labelEl = node.querySelector('.nodeLabel') || node;
            const text = labelEl.innerText;
            if (text) showHoverPopover(e, text);
          });

          node.addEventListener('mouseleave', () => {
            hideHoverPopover();
          });

          node.addEventListener('click', (e) => {
            const labelEl = node.querySelector('.nodeLabel') || node;
            const text = labelEl.innerText;
            if (text) selectNodeAtoms(text, node);
          });
        });
      }, 1200);
    });
  </script>
</body>
</html>
